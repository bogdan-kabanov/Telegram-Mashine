name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build on server
    runs-on: [self-hosted, linux, bot-ai]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Sync release into /opt/bot-ai
        run: |
          set -euo pipefail
          APP_DIR="${DEPLOY_APP_DIR:-/opt/bot-ai}"
          mkdir -p "$APP_DIR"
          # Sync code onto the live tree. Never touch secrets / DB / runtime media.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.next/' \
            --exclude='node_modules/' \
            --exclude='.cursor/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='data/app.db' \
            --exclude='data/app.db-shm' \
            --exclude='data/app.db-wal' \
            --exclude='data/logs/' \
            --exclude='data/runtime/' \
            --exclude='data/reviews/' \
            --exclude='data/renders/' \
            --exclude='public/renders/' \
            --exclude='public/ставки/' \
            --exclude='public/2026.07.22/' \
            --exclude='public/2026.07.23/' \
            --exclude='фит/' \
            --exclude='.tmp-test-photos/' \
            --exclude='.tmp-tails/' \
            --exclude='data/media/receipt_templates/_backup_before_fit_20260811_011109/' \
            --exclude='data/media/receipt_templates/_vlad_fit_refs/' \
            --exclude='bot-ai-release.tar.gz' \
            "$GITHUB_WORKSPACE"/ "$APP_DIR"/
          test -f "$APP_DIR/.env" || { echo "ERROR: $APP_DIR/.env missing on server"; exit 1; }
          chmod 600 "$APP_DIR/.env"
          chmod +x "$APP_DIR/deploy/"*.sh

      - name: Native rebuild + healthcheck
        run: |
          set -euo pipefail
          export APP_DIR="${DEPLOY_APP_DIR:-/opt/bot-ai}"
          bash "$APP_DIR/deploy/remote-update.sh"
